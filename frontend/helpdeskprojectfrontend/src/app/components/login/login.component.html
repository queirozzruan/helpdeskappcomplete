<div class="container">
  <form class="form mat-elevation-z8">

    <h1>Help Desk - Estágio Supervisionado 2</h1>

    <img src="assets/img/images.jpg" alt="Unicatólica Logo">

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>E-mail</mat-label>
      <input [formControl]="email" required [(ngModel)]="creds.email" name="email" matInput placeholder="seu@email.com">
      <mat-icon matSuffix>email</mat-icon>
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Senha</mat-label>
      <input [formControl]="senha" required [(ngModel)]="creds.senha" name="senha" type="password" matInput placeholder="*****">
      <mat-icon matSuffix>password</mat-icon>
    </mat-form-field>

    <button [disabled]="!validaCampos()" (click)="logar()" class="full-width mat-elevation-z4" mat-stroked-button color="primary">Login</button>

  </form>
</div>
