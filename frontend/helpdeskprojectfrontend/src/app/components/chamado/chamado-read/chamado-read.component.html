<div class="container mat-elevation-z8">
  <form class="form">

    <h1 class="fullWidth">Chamado {{ chamado.id }}</h1>

    <mat-form-field class="fullWidth" appearance="outline">
      <mat-label>Título do chamado</mat-label>
      <input [(ngModel)]="chamado.titulo" name="titulo" [disabled]="true" matInput>
    </mat-form-field>

    <div class="status-prioridade">
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <input [value]="retornaStatus(chamado.status)" name="status" [disabled]="true" matInput>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Prioridade</mat-label>
        <input [value]="retornaPrioridade(chamado.prioridade)" name="prioridade" [disabled]="true" matInput>
      </mat-form-field>
    </div>

    <div class="tecnico">
      <mat-form-field class="fullWidth" appearance="outline">
        <mat-label>Técnico</mat-label>
        <input [(ngModel)]="chamado.nomeTecnico" name="tecnico" [disabled]="true" matInput>
      </mat-form-field>
    </div>

    <div class="cliente">
      <mat-form-field class="fullWidth" appearance="outline">
        <mat-label>Cliente</mat-label>
        <input [(ngModel)]="chamado.nomeCliente" name="cliente" [disabled]="true" matInput>
      </mat-form-field>
    </div>

    <mat-form-field class="fullWidth" appearance="outline">
      <mat-label>Observações</mat-label>
      <textarea [(ngModel)]="chamado.observacoes" name="observacoes" [disabled]="true" matInput></textarea>
    </mat-form-field>

    <button class="fullWidth mat-elevation-z4" mat-stroked-button color="warn" routerLink="../../">Fechar</button>

  </form>
</div>
